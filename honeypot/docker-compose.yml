---
# Honeypot website for JA3/JA4 TLS fingerprinting research
#
# Deploy: docker compose up -d --build
# Generates self-signed TLS cert on first run (entrypoint script).
# HTTP :80 and HTTPS :443 exposed for scanner fingerprinting.

services:
  honeypot:
    build: .
    container_name: quiet-room-honeypot
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - certs:/opt/quiet-room/certs
      - logs:/var/log/quiet-room
    environment:
      QUIET_ROOM_LOG_DIR: /var/log/quiet-room
      QUIET_ROOM_CERT_DIR: /opt/quiet-room/certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Generate self-signed cert if missing
        if [ ! -f /opt/quiet-room/certs/server.crt ]; then
          echo "Generating self-signed TLS certificate..."
          openssl req -x509 -newkey rsa:2048 \
            -keyout /opt/quiet-room/certs/server.key \
            -out /opt/quiet-room/certs/server.crt \
            -days 365 -nodes \
            -subj "/CN=portal.acme-corp.internal/O=Acme Corp/C=US"
        fi
        exec gunicorn \
          --bind 0.0.0.0:8080 \
          --bind 0.0.0.0:8443 \
          --certfile /opt/quiet-room/certs/server.crt \
          --keyfile /opt/quiet-room/certs/server.key \
          --access-logfile - \
          --workers 2 \
          app:app
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  certs:
  logs:
